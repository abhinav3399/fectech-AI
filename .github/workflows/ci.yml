name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint || echo "::warning::eslint reported issues (pre-existing baseline)"

  backend:
    name: Backend unit tests (light)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Only the light deps the unit tests need — NOT the heavy ML requirements.txt.
      - run: pip install "pydantic-settings>=2" httpx pytest
      - run: pytest tests/test_config.py tests/test_voice_routing.py tests/test_security.py -q
